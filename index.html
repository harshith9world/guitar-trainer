<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>God Mode Guitar Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
    }

    .string {
        stroke: #64748b;
        stroke-width: 2;
    }

    .fret {
        stroke: #334155;
        stroke-width: 4;
    }

    .finger {
        fill: #3b82f6;
        transition: all 0.3s ease;
    }

    .nut {
        stroke: #cbd5e1;
        stroke-width: 6;
    }

    select {
        background-color: #1e293b;
        color: white;
        border: 1px solid #334155;
        padding: 10px 14px;
        border-radius: 12px;
        outline: none;
        width: 100%;
    }

    .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #ef4444;
    }

    .status-active {
        background: #22c55e;
        box-shadow: 0 0 12px #22c55e;
    }
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-5xl w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">

    <!-- HEADER -->
    <div class="p-6 bg-slate-900 border-b border-slate-700 flex flex-col md:flex-row gap-4 justify-between items-center">

        <h1 class="text-3xl font-bold text-blue-400 tracking-tight">
            Guitar<span class="text-white">Pro</span> Trainer
        </h1>

        <div class="flex gap-3 w-full md:w-auto">

            <!-- CHORD SELECTOR -->
            <select id="chordSelect">

                <option value="C Maj">C Maj</option>
                <option value="G Maj">G Maj</option>
                <option value="D Maj">D Maj</option>
                <option value="A Maj">A Maj</option>
                <option value="E Maj">E Maj</option>

                <option value="A Min">A Min</option>
                <option value="E Min">E Min</option>

            </select>

            <!-- MIC BUTTON -->
            <button
                id="micBtn"
                class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all">

                🎤 Enable Mic

            </button>
            <button
                id="openTunerBtn"
                class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all">
                
                🎸 Tuner
            </button>
            
        </div>

    </div>

    <!-- MAIN -->
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- TARGET -->
        <div class="flex flex-col items-center justify-center p-6 bg-slate-900 rounded-xl border border-slate-700">

            <h2 class="text-gray-400 uppercase tracking-widest text-sm mb-2">
                Target Chord
            </h2>

            <div
                id="targetChordDisplay"
                class="text-6xl font-black text-white mb-6">

                C Maj

            </div>
            
            <button
                onclick="nextChord()"
                class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-lg transition font-semibold">

                Next Chord

            </button>

        </div>

        <!-- DETECTION -->
        <div class="flex flex-col items-center justify-center p-6 bg-slate-900 rounded-xl border border-slate-700 relative overflow-hidden">

            <h2 class="text-gray-400 uppercase tracking-widest text-sm mb-2 z-10">
                Detected Pitch
            </h2>

            <div
                id="detectedNoteDisplay"
                class="text-6xl font-black text-emerald-400 z-10">

                --

            </div>

            <div
                id="frequencyDisplay"
                class="text-sm text-gray-500 mt-2 z-10">

                0 Hz

            </div>

            <!-- STATUS -->
            <div class="flex items-center gap-2 mt-4 z-10">

                <div id="statusDot" class="status-dot"></div>

                <span id="statusText" class="text-sm text-gray-400">
                    Waiting for audio...
                </span>

            </div>

            <!-- GLOW -->
            <div
                id="glow"
                class="absolute inset-0 bg-emerald-500 opacity-0 transition-opacity duration-300 pointer-events-none">
            </div>

        </div>

    </div>

    <!-- FRETBOARD -->
    <div class="p-6 bg-slate-800 border-t border-slate-700">

        <h3 class="text-gray-400 uppercase tracking-widest text-sm mb-4">
            Fretboard
        </h3>

        <div class="overflow-x-auto">

            <svg
                viewBox="0 0 800 200"
                class="w-full min-w-[600px] bg-slate-900 rounded-lg p-4">

                <!-- STRINGS -->
                <line class="string" x1="50" y1="25" x2="780" y2="25"/>
                <line class="string" x1="50" y1="55" x2="780" y2="55"/>
                <line class="string" x1="50" y1="85" x2="780" y2="85"/>
                <line class="string" x1="50" y1="115" x2="780" y2="115"/>
                <line class="string" x1="50" y1="145" x2="780" y2="145"/>
                <line class="string" x1="50" y1="175" x2="780" y2="175"/>

                <!-- FRETS -->
                <line class="nut" x1="50" y1="20" x2="50" y2="180"/>

                <line class="fret" x1="196" y1="20" x2="196" y2="180"/>
                <line class="fret" x1="342" y1="20" x2="342" y2="180"/>
                <line class="fret" x1="488" y1="20" x2="488" y2="180"/>
                <line class="fret" x1="634" y1="20" x2="634" y2="180"/>
                <line class="fret" x1="780" y1="20" x2="780" y2="180"/>

                <!-- MARKERS -->
                <circle cx="415" cy="100" r="6" fill="#475569"/>
                <circle cx="707" cy="100" r="6" fill="#475569"/>

                <!-- DYNAMIC -->
                <g id="fingers"></g>

            </svg>

        </div>

    </div>

</div>
<!--/////////////////////////////////////////////////////////
//Tuner
////////////////////////////////////////////////////////>

<!-- TUNER MODAL -->
<div
    id="tunerModal"
    class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">

    <div class="bg-slate-900 w-full max-w-md rounded-2xl border border-slate-700 p-6 relative">

        <!-- CLOSE -->
        <button
            id="closeTunerBtn"
            class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">

            ×

        </button>

        <h2 class="text-3xl font-black text-center mb-6 text-emerald-400">
            Guitar Tuner
        </h2>

        <!-- NOTE -->
        <div
            id="tunerNote"
            class="text-7xl font-black text-center text-white mb-2">

            --

        </div>

        <!-- FREQ -->
        <div
            id="tunerFreq"
            class="text-center text-gray-400 text-lg mb-6">

            0 Hz

        </div>

        <!-- TARGET STRING -->
        <div class="text-center mb-4">

            <div class="text-gray-400 uppercase text-sm">
                Closest String
            </div>

            <div
                id="closestString"
                class="text-3xl font-bold text-emerald-400">

                --

            </div>

        </div>

        <!-- TUNING STATUS -->
        <div
            id="tuningStatus"
            class="text-center text-2xl font-bold text-yellow-400 mb-6">

            Waiting...

        </div>

        <!-- TUNING BAR -->
        <div class="w-full h-4 bg-slate-700 rounded-full overflow-hidden relative">

            <div
                id="tuningNeedle"
                class="absolute top-0 left-1/2 w-2 h-4 bg-emerald-400 transition-all duration-100"
                style="transform: translateX(-50%);">
            </div>

        </div>

        <!-- STANDARD TUNING -->
        <div class="grid grid-cols-6 gap-2 mt-8 text-center">

            <div>E</div>
            <div>A</div>
            <div>D</div>
            <div>G</div>
            <div>B</div>
            <div>E</div>

        </div>

    </div>

</div>


<script>

//////////////////////////////////////////////////////////
// SECURITY CHECK
//////////////////////////////////////////////////////////

if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost" &&
    location.hostname !== "127.0.0.1"
) {
    alert(
        "Microphone requires HTTPS or localhost.\n\n" +
        "Upload to GitHub Pages or use local server."
    );
}

//////////////////////////////////////////////////////////
// CHORD DATABASE
//////////////////////////////////////////////////////////

const chordDb = {

    // MAJOR
    "C Maj": { positions:[0,1,0,2,3,-1], rootNote:"C" },
    "C# Maj": { positions:[4,6,6,6,4,-1], rootNote:"C#" },
    "D Maj": { positions:[2,3,2,0,-1,-1], rootNote:"D" },
    "D# Maj": { positions:[6,8,8,8,6,-1], rootNote:"D#" },
    "E Maj": { positions:[0,0,1,2,2,0], rootNote:"E" },
    "F Maj": { positions:[1,1,2,3,3,1], rootNote:"F" },
    "F# Maj": { positions:[2,2,3,4,4,2], rootNote:"F#" },
    "G Maj": { positions:[3,0,0,0,2,3], rootNote:"G" },
    "G# Maj": { positions:[4,4,5,6,6,4], rootNote:"G#" },
    "A Maj": { positions:[0,2,2,2,0,-1], rootNote:"A" },
    "A# Maj": { positions:[1,3,3,3,1,-1], rootNote:"A#" },
    "B Maj": { positions:[2,4,4,4,2,-1], rootNote:"B" },

    // MINOR
    "C Min": { positions:[3,4,5,5,3,-1], rootNote:"C" },
    "C# Min": { positions:[4,5,6,6,4,-1], rootNote:"C#" },
    "D Min": { positions:[1,3,2,0,-1,-1], rootNote:"D" },
    "D# Min": { positions:[6,7,8,8,6,-1], rootNote:"D#" },
    "E Min": { positions:[0,0,0,2,2,0], rootNote:"E" },
    "F Min": { positions:[1,1,1,3,3,1], rootNote:"F" },
    "F# Min": { positions:[2,2,2,4,4,2], rootNote:"F#" },
    "G Min": { positions:[3,3,3,5,5,3], rootNote:"G" },
    "G# Min": { positions:[4,4,4,6,6,4], rootNote:"G#" },
    "A Min": { positions:[0,1,2,2,0,-1], rootNote:"A" },
    "A# Min": { positions:[1,2,3,3,1,-1], rootNote:"A#" },
    "B Min": { positions:[2,3,4,4,2,-1], rootNote:"B" },

    // DOMINANT 7
    "C7": { positions:[0,1,3,2,3,-1], rootNote:"C" },
    "D7": { positions:[2,1,2,0,-1,-1], rootNote:"D" },
    "E7": { positions:[0,0,1,0,2,0], rootNote:"E" },
    "F7": { positions:[1,1,2,1,3,1], rootNote:"F" },
    "G7": { positions:[1,0,0,0,2,3], rootNote:"G" },
    "A7": { positions:[0,2,0,2,0,-1], rootNote:"A" },
    "B7": { positions:[2,0,2,1,2,-1], rootNote:"B" },

    // MAJOR 7
    "Cmaj7": { positions:[0,0,0,2,3,-1], rootNote:"C" },
    "Dmaj7": { positions:[2,2,2,0,-1,-1], rootNote:"D" },
    "Emaj7": { positions:[0,0,1,1,2,0], rootNote:"E" },
    "Fmaj7": { positions:[0,1,2,3,-1,-1], rootNote:"F" },
    "Gmaj7": { positions:[2,0,0,0,2,3], rootNote:"G" },
    "Amaj7": { positions:[0,2,1,2,0,-1], rootNote:"A" },

    // MINOR 7
    "Cm7": { positions:[3,4,3,5,3,-1], rootNote:"C" },
    "Dm7": { positions:[1,1,2,0,-1,-1], rootNote:"D" },
    "Em7": { positions:[0,0,0,0,2,0], rootNote:"E" },
    "Fm7": { positions:[1,1,1,1,3,1], rootNote:"F" },
    "Gm7": { positions:[3,3,3,3,5,3], rootNote:"G" },
    "Am7": { positions:[0,1,0,2,0,-1], rootNote:"A" },
    "Bm7": { positions:[2,3,2,4,2,-1], rootNote:"B" },

    // SUSPENDED
    "Csus2": { positions:[3,3,0,0,3,-1], rootNote:"C" },
    "Csus4": { positions:[1,1,0,3,3,-1], rootNote:"C" },
    "Dsus2": { positions:[0,3,2,0,-1,-1], rootNote:"D" },
    "Dsus4": { positions:[3,3,2,0,-1,-1], rootNote:"D" },
    "Esus4": { positions:[0,0,2,2,2,0], rootNote:"E" },
    "Gsus4": { positions:[1,0,0,0,3,3], rootNote:"G" },
    "Asus2": { positions:[0,0,2,2,0,-1], rootNote:"A" },
    "Asus4": { positions:[0,3,2,2,0,-1], rootNote:"A" },

    // POWER CHORDS
    "C5": { positions:[-1,-1,5,5,3,-1], rootNote:"C" },
    "D5": { positions:[-1,-1,7,7,5,-1], rootNote:"D" },
    "E5": { positions:[-1,-1,9,9,7,0], rootNote:"E" },
    "F5": { positions:[-1,-1,10,10,8,1], rootNote:"F" },
    "G5": { positions:[-1,-1,0,0,2,3], rootNote:"G" },
    "A5": { positions:[-1,-1,2,2,0,-1], rootNote:"A" },
    "B5": { positions:[-1,-1,4,4,2,-1], rootNote:"B" }

};

const chordKeys = Object.keys(chordDb);

let currentChordIndex = 0;

//////////////////////////////////////////////////////////
// CHORD SELECTOR
//////////////////////////////////////////////////////////

const chordSelect = document.getElementById("chordSelect");

chordSelect.innerHTML = "";

Object.keys(chordDb).forEach(chord => {

    const option = document.createElement("option");

    option.value = chord;

    option.textContent = chord;

    chordSelect.appendChild(option);

});

chordSelect.addEventListener("change", () => {

    const chordName = chordSelect.value;

    currentChordIndex = chordKeys.indexOf(chordName);

    drawFretboard(chordName);

});

//////////////////////////////////////////////////////////
// AUDIO ENGINE
//////////////////////////////////////////////////////////

let audioContext;
let analyser;
let isListening = false;

async function startAudio() {

    if (isListening) return;

    try {

        // CREATE AUDIO CONTEXT
        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();

        // IMPORTANT FOR ANDROID
        await audioContext.resume();

        // GET MICROPHONE
        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio: {

                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false,
                    channelCount: 1,
                    sampleRate: 48000

                }

            });

        // SOURCE
        const source =
            audioContext.createMediaStreamSource(stream);

        // ANALYSER
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 4096;

        source.connect(analyser);

        isListening = true;

        // UI UPDATE
        document.getElementById("micBtn").innerText =
            "🎙️ Listening";

        document.getElementById("micBtn")
            .classList.replace("bg-blue-600", "bg-red-500");

        document.getElementById("statusText").innerText =
            "Microphone active";

        document.getElementById("statusDot")
            .classList.add("status-active");

        // START LOOP
        detectPitch();

    } catch (err) {

        console.error(err);

        alert(
            "Microphone failed.\n\n" +
            "1. Allow mic permission\n" +
            "2. Reload page\n" +
            "3. Use HTTPS\n" +
            "4. Try Chrome if Opera fails"
        );
    }
}

document.getElementById("micBtn")
    .addEventListener("click", startAudio);

//////////////////////////////////////////////////////////
// AUTOCORRELATION
//////////////////////////////////////////////////////////

function autoCorrelate(buffer, sampleRate) {

    let SIZE = buffer.length;

    let rms = 0;

    for (let i = 0; i < SIZE; i++) {

        rms += buffer[i] * buffer[i];

    }

    rms = Math.sqrt(rms / SIZE);

    // LOWERED FOR PHONE MICS
    if (rms < 0.003) return -1;

    let r1 = 0;
    let r2 = SIZE - 1;
    let threshold = 0.2;

    for (let i = 0; i < SIZE / 2; i++) {

        if (Math.abs(buffer[i]) < threshold) {

            r1 = i;
            break;
        }
    }

    for (let i = 1; i < SIZE / 2; i++) {

        if (Math.abs(buffer[SIZE - i]) < threshold) {

            r2 = SIZE - i;
            break;
        }
    }

    buffer = buffer.slice(r1, r2);

    SIZE = buffer.length;

    const c = new Array(SIZE).fill(0);

    for (let i = 0; i < SIZE; i++) {

        for (let j = 0; j < SIZE - i; j++) {

            c[i] += buffer[j] * buffer[j + i];

        }
    }

    let d = 0;

    while (c[d] > c[d + 1]) d++;

    let maxValue = -1;
    let maxPosition = -1;

    for (let i = d; i < SIZE; i++) {

        if (c[i] > maxValue) {

            maxValue = c[i];
            maxPosition = i;

        }
    }

    const T0 = maxPosition;

    return sampleRate / T0;
}

//////////////////////////////////////////////////////////
// FREQUENCY -> NOTE
//////////////////////////////////////////////////////////

const noteStrings = [

    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"

];

function frequencyToNote(freq) {

    const noteNum =
        12 * (Math.log(freq / 440) / Math.log(2));

    const midi =
        Math.round(noteNum) + 69;

    return noteStrings[midi % 12];
}

//////////////////////////////////////////////////////////
// DETECT LOOP
//////////////////////////////////////////////////////////

function detectPitch() {

    if (!isListening) return;

    const buffer =
        new Float32Array(analyser.fftSize);

    analyser.getFloatTimeDomainData(buffer);

    const pitch =
        autoCorrelate(buffer, audioContext.sampleRate);

    if (pitch !== -1 && pitch > 50 && pitch < 1200) {

        const note =
            frequencyToNote(pitch);
            updateTuner(pitch, note);
        document.getElementById("detectedNoteDisplay")
            .innerText = note;

        document.getElementById("frequencyDisplay")
            .innerText = pitch.toFixed(2) + " Hz";

        const targetRoot =
            chordDb[chordKeys[currentChordIndex]].rootNote;

        if (note === targetRoot) {

            document.getElementById("glow").style.opacity = "0.2";

        } else {

            document.getElementById("glow").style.opacity = "0";
        }

    } else {

        document.getElementById("glow").style.opacity = "0";
    }

    requestAnimationFrame(detectPitch);
}

//////////////////////////////////////////////////////////
// DRAW FRETBOARD
//////////////////////////////////////////////////////////

function drawFretboard(chordName) {

    const chord = chordDb[chordName];

    const fingersGroup =
        document.getElementById("fingers");

    fingersGroup.innerHTML = "";

    document.getElementById("targetChordDisplay")
        .innerText = chordName;

    chord.positions.forEach((fret, stringIndex) => {

        const yPos = 25 + (stringIndex * 30);

        if (fret > 0) {

            const fretWidth = 146;

            const xPos =
                50 + (fret * fretWidth) - (fretWidth / 2);

            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute("cx", xPos);
            circle.setAttribute("cy", yPos);
            circle.setAttribute("r", "12");
            circle.setAttribute("class", "finger");

            fingersGroup.appendChild(circle);

        }

        else if (fret === -1) {

            const text =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            text.setAttribute("x", "20");
            text.setAttribute("y", yPos + 6);

            text.setAttribute("fill", "#ef4444");

            text.setAttribute("font-size", "20");

            text.setAttribute("font-weight", "bold");

            text.textContent = "X";

            fingersGroup.appendChild(text);
        }
    });
}

//////////////////////////////////////////////////////////
// NEXT CHORD
//////////////////////////////////////////////////////////

function nextChord() {

    currentChordIndex =
        (currentChordIndex + 1) % chordKeys.length;

    chordSelect.value =
        chordKeys[currentChordIndex];

    drawFretboard(chordKeys[currentChordIndex]);
}
//////////////////////////////////////////////////////////
// TUNER SYSTEM
//////////////////////////////////////////////////////////

const tunerModal =
    document.getElementById("tunerModal");

document.getElementById("openTunerBtn")
    .addEventListener("click", () => {

        tunerModal.classList.remove("hidden");

        tunerModal.classList.add("flex");

});

document.getElementById("closeTunerBtn")
    .addEventListener("click", () => {

        tunerModal.classList.add("hidden");

        tunerModal.classList.remove("flex");

});

//////////////////////////////////////////////////////////
// STANDARD GUITAR TUNING
//////////////////////////////////////////////////////////

const guitarStrings = [

    { note: "E", freq: 82.41 },
    { note: "A", freq: 110.00 },
    { note: "D", freq: 146.83 },
    { note: "G", freq: 196.00 },
    { note: "B", freq: 246.94 },
    { note: "E", freq: 329.63 }

];

//////////////////////////////////////////////////////////
// FIND CLOSEST STRING
//////////////////////////////////////////////////////////

function getClosestString(freq) {

    let closest = guitarStrings[0];

    let minDiff = Infinity;

    guitarStrings.forEach(string => {

        const diff =
            Math.abs(freq - string.freq);

        if (diff < minDiff) {

            minDiff = diff;

            closest = string;

        }

    });

    return closest;
}

//////////////////////////////////////////////////////////
// CENTS DIFFERENCE
//////////////////////////////////////////////////////////

function getCents(freq, targetFreq) {

    return 1200 *
        Math.log2(freq / targetFreq);

}

//////////////////////////////////////////////////////////
// UPDATE TUNER UI
//////////////////////////////////////////////////////////

function updateTuner(freq, note) {

    if (!tunerModal.classList.contains("flex"))
        return;

    const closest =
        getClosestString(freq);

    const cents =
        getCents(freq, closest.freq);

    document.getElementById("tunerNote")
        .innerText = note;

    document.getElementById("tunerFreq")
        .innerText = freq.toFixed(2) + " Hz";

    document.getElementById("closestString")
        .innerText = closest.note;

    const needle =
        document.getElementById("tuningNeedle");

    let pos =
        Math.max(-50, Math.min(50, cents));

    needle.style.left =
        (50 + pos / 2) + "%";

    const status =
        document.getElementById("tuningStatus");

    if (Math.abs(cents) < 5) {

        status.innerText = "IN TUNE";

        status.className =
            "text-center text-2xl font-bold text-emerald-400 mb-6";

    }

    else if (cents < 0) {

        status.innerText = "TOO LOW";

        status.className =
            "text-center text-2xl font-bold text-yellow-400 mb-6";

    }

    else {

        status.innerText = "TOO HIGH";

        status.className =
            "text-center text-2xl font-bold text-red-400 mb-6";

    }
}

    
//////////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////////

drawFretboard(chordKeys[0]);

</script>

</body>
</html>
